<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var html = document.documentElement;
        html.classList.add('browser-env-ready');
        if (/iPhone|iPad|iPod/i.test(ua)) html.classList.add('browser-ios');
        if (/Android/i.test(ua)) html.classList.add('browser-android');
        if (/SamsungBrowser/i.test(ua)) html.classList.add('browser-samsung');
        if (/FBAN|FBAV|Instagram|Messenger|Twitter|LinkedInApp|TikTok|Line\//i.test(ua)) html.classList.add('browser-in-app');
      })();
    </script>
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="description" content="Find kink and BDSM events, local groups, educators, presenters, vendors, organizations, and community tools. Kink Social is free to join and is not a dating site." />
