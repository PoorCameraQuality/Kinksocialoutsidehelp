# Isolated STAGING stack for E2E verification on the VPS.
# Never shares volumes, networks, ports, or env with the production project (`c2k` / /opt/c2k).
#
# Usage (from /opt/c2k-staging):
#   docker compose -f docker-compose.staging.yml build
#   docker compose -f docker-compose.staging.yml up -d
#
# Interpolation values (.env in this directory — NOT committed):
#   STAGING_PUBLIC_URL=http://<host>:8080
#   STAGING_POSTGRES_PASSWORD=<generated>
#   MINIO_ROOT_USER=<generated>  MINIO_ROOT_PASSWORD=<generated>
# Runtime env for api/worker lives in .env.staging (NOT committed).
name: c2k-staging

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    depends_on:
      - web
      - api
      - minio

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ''
        VITE_SITE_URL: ${STAGING_PUBLIC_URL:-http://127.0.0.1:8080}
        VITE_PUBLIC_LAUNCH: 'false'
        VITE_LEGAL_PUBLISHED: 'false'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # Staging is intentionally NOT production: HTTP cookies + dev-profile
      # scanner noop + seedable database. Do not point this at prod data.
      - NODE_ENV=staging
      - C2K_ENV=staging
      - HOST=0.0.0.0
      - PORT=3001
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - C2K_ENV=staging
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # Host-run migrations/seeds connect via 127.0.0.1:5433 (prod uses 5432).
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: c2k_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: c2k_staging
    volumes:
      - c2k_pgdata_staging:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - c2k_redisdata_staging:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # Host-run seed scripts upload seed images via 127.0.0.1:9100 (prod exposes no minio port).
    ports:
      - '127.0.0.1:9100:9000'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - c2k_minio_staging:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET/media 2>/dev/null || true &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-c2k-uploads}

volumes:
  caddy_staging_data:
  caddy_staging_config:
  c2k_pgdata_staging:
  c2k_redisdata_staging:
  c2k_minio_staging:
