# Production deploy — manual dispatch only, structurally gated on CI.
#
# Safety model (launch-hardening PR 2):
#   - No automatic deploy on push; a human dispatches and the protected
#     `production` environment requires reviewer approval.
#   - The full CI workflow (typecheck, build, unit tests, media gate, DB smokes)
#     must pass in THIS run before the deploy job can start.
#   - SSH is key-based as the unprivileged `deploy` user; sudo is restricted to
#     /usr/local/bin/c2k-deploy and /usr/local/bin/c2k-rollback only.
#   - c2k-deploy stages the release in /opt/c2k-releases/<stamp>, snapshots the
#     current code tree for rollback, then syncs code (never env/mail/backups).
#   - Rollback: dispatch this workflow with rollback=true (uses newest snapshot).
#
# Required secrets: SSH_DEPLOY_KEY (ed25519 private key for the `deploy` user).
# The legacy root SSH_PASS secret must be deleted after key deploys are proven.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Roll back to the newest pre-deploy code snapshot instead of deploying'
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kink.social
    steps:
      - uses: actions/checkout@v4

      - name: Create deploy tarball
        run: tar -czf deploy.tgz --exclude-from=.deployignore .

      - name: Upload tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.25.196.84
          username: deploy
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: deploy.tgz
          target: /tmp

      - name: Deploy on VPS (staged release + rollback snapshot)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.25.196.84
          username: deploy
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            sudo /usr/local/bin/c2k-deploy /tmp/deploy.tgz

      - name: Verify health
        run: curl -sf https://kink.social/api/health/ready

  rollback:
    if: ${{ inputs.rollback }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kink.social
    steps:
      - name: Roll back on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.25.196.84
          username: deploy
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            sudo /usr/local/bin/c2k-rollback

      - name: Verify health
        run: curl -sf https://kink.social/api/health/ready
